[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ternara-seed-to-silicon"
version = "0.1.0"
description = "Self-fitting FPGA-native ternary AI on Q27 (0% Vivado, 0 DSP, 0 DRAM) with on-chip Plug-and-Learn and Ternara Mesh"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
ternara-seed = "ternara_seed.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
